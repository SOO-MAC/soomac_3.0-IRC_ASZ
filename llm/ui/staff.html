<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ASZ Staff</title>

<style>

:root {
    --red: #d92828;
    --yellow: #f5bd3d;

    --cream: #fff8e8;
    --paper: #fffdf8;

    --brown: #352b27;
    --muted: #786a61;

    --line: #ead8c4;

    --green: #258657;
    --green-soft: #e5f6ec;

    --blue: #2777c8;
    --blue-soft: #e9f3fd;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family:
        "Pretendard",
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        sans-serif;

    background: var(--cream);
    color: var(--brown);
}


.screen {
    width: 100vw;
    height: 100vh;

    padding: 18px 24px;

    display: flex;
    flex-direction: column;

    background:
        linear-gradient(
            135deg,
            #fffdf8,
            #fff5dc
        );
}


/* ===============================
   HEADER
=============================== */

.header {
    height: 58px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
}

.brand-main {
    font-size: 29px;
    font-weight: 950;

    color: var(--red);
}

.brand-sub {
    font-size: 22px;
    font-weight: 900;
}

.status {
    min-height: 34px;

    padding: 0 14px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    border-radius: 999px;

    background: var(--green-soft);
    color: var(--green);

    font-size: 14px;
    font-weight: 900;
}


/* ===============================
   ORDER INFO
=============================== */

.order-info {
    height: 96px;

    flex-shrink: 0;

    display: grid;
    grid-template-columns: 1fr auto;

    align-items: center;

    padding: 14px 22px;

    background:
        linear-gradient(
            135deg,
            #d92828,
            #ba2020
        );

    color: white;

    border-radius: 18px;
}

.order-main-info {
    display: flex;
    align-items: center;

    gap: 28px;
}

.number-group {
    display: flex;
    flex-direction: column;
}

.number-label {
    font-size: 13px;
    font-weight: 800;

    opacity: .75;
}

.order-number {
    margin-top: 2px;

    font-size: 42px;
    line-height: 1;

    font-weight: 950;
}

.mobile-number-group {
    display: none;

    flex-direction: column;

    padding-left: 27px;

    border-left:
        1px solid
        rgba(255,255,255,.35);
}

.mobile-number {
    margin-top: 2px;

    font-size: 35px;
    line-height: 1;

    font-weight: 950;
}

.order-mode {
    padding: 8px 13px;

    border-radius: 999px;

    background:
        rgba(255,255,255,.17);

    font-size: 13px;
    font-weight: 900;
}


/* ===============================
   ORDER PANEL
=============================== */

.order-panel {
    flex: 1;
    min-height: 0;

    margin-top: 12px;

    display: flex;
    flex-direction: column;

    border: 2px solid var(--line);
    border-radius: 18px;

    overflow: hidden;

    background: var(--paper);
}

.order-header {
    height: 55px;

    flex-shrink: 0;

    padding: 0 18px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background:
        linear-gradient(
            90deg,
            #ffedaa,
            #fff8dd
        );

    border-bottom:
        2px solid #efca68;
}

.order-title {
    font-size: 22px;
    font-weight: 950;
}

.order-count {
    min-height: 30px;

    padding: 0 12px;

    display: inline-flex;
    align-items: center;

    border-radius: 999px;

    background: var(--red);
    color: white;

    font-size: 13px;
    font-weight: 900;
}


/* ===============================
   VERTICAL 8 ITEM LIST
=============================== */

.order-list {
    flex: 1;
    min-height: 0;

    padding: 8px 12px;

    overflow-y: auto;

    display: grid;

    grid-template-columns: 1fr;

    /*
       1080p 기준 최대 8개가
       한 화면 안에 들어오도록 압축
    */
    grid-auto-rows:
        minmax(70px, 1fr);

    gap: 6px;
}


.order-item {
    position: relative;

    min-height: 0;

    padding:
        9px 14px
        8px 20px;

    display: flex;
    flex-direction: column;
    justify-content: center;

    background: white;

    border:
        1px solid
        #ecdbc8;

    border-radius: 11px;

    overflow: hidden;
}

.order-item::before {
    content: "";

    position: absolute;

    left: 0;
    top: 0;
    bottom: 0;

    width: 6px;

    background: var(--red);
}

.order-main {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 15px;
}

.order-name-area {
    display: flex;
    align-items: center;

    min-width: 0;
}

.line-number {
    width: 31px;
    height: 31px;

    margin-right: 10px;

    flex-shrink: 0;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: var(--red);
    color: white;

    font-size: 14px;
    font-weight: 950;
}

.order-name {
    font-size: 19px;
    font-weight: 950;

    white-space: nowrap;
}

.quantity {
    margin-left: 7px;

    color: var(--muted);

    font-size: 15px;
    font-weight: 850;
}

.order-price {
    flex-shrink: 0;

    font-size: 18px;
    font-weight: 950;

    color: var(--red);
}

.options {
    margin-top: 6px;
    margin-left: 41px;

    display: flex;
    align-items: center;

    flex-wrap: wrap;

    gap: 5px;
}

.option {
    min-height: 25px;

    padding: 4px 8px;

    display: inline-flex;
    align-items: center;

    border-radius: 7px;

    background: #fff0bc;
    color: #70510a;

    font-size: 13px;
    font-weight: 850;

    line-height: 1;
}

.option.add {
    background: #ffe29a;
}

.option.remove {
    background: #ffe1e1;
    color: #a92626;
}


/* ===============================
   TOTAL
=============================== */

.total-area {
    height: 73px;

    flex-shrink: 0;

    padding: 0 20px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background:
        linear-gradient(
            90deg,
            #fff0b7,
            #fff8df
        );

    border-top:
        3px solid var(--yellow);
}

.total-label {
    font-size: 20px;
    font-weight: 950;
}

.total-price {
    font-size: 34px;
    font-weight: 950;

    color: var(--red);
}


/* ===============================
   EMPTY
=============================== */

.empty {
    grid-row:
        1 / span 8;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    color: var(--muted);
}

.empty-main {
    font-size: 24px;
    font-weight: 900;
}

.empty-sub {
    margin-top: 6px;

    font-size: 15px;
    font-weight: 700;
}


/* scrollbar */

.order-list::-webkit-scrollbar {
    width: 6px;
}

.order-list::-webkit-scrollbar-thumb {
    background: #d4bda7;
    border-radius: 99px;
}

</style>


<style id="staff-grid-4x2-final">

/* =========================================================
   STAFF 주문판
   4 columns × 2 rows = 한 화면 최대 8개
========================================================= */

.order-list {
    flex: 1;
    min-height: 0;

    padding: 12px;

    overflow-y: auto;

    display: grid;

    /* 4칸 × 2줄 */
    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    grid-template-rows:
        repeat(2, minmax(0, 1fr));

    /* 9번째 이후 동일 크기로 아래 생성 */
    grid-auto-rows:
        calc((100% - 10px) / 2);

    grid-auto-flow: row;

    gap: 10px;

    align-content: start;
}


/* 주문 하나 = Grid 한 칸 */

.order-item {
    position: relative;

    width: 100%;
    height: 100%;

    min-width: 0;
    min-height: 0;

    padding:
        16px 15px
        14px 18px;

    display: flex;
    flex-direction: column;

    justify-content: flex-start;

    background: white;

    border:
        1px solid #ecdbc8;

    border-radius: 13px;

    overflow: hidden;
}


.order-item::before {
    content: "";

    position: absolute;

    left: 0;
    top: 0;
    bottom: 0;

    width: 6px;

    background: var(--red);
}


/* 메뉴 상단 */

.order-main {
    display: flex;
    flex-direction: column;

    align-items: stretch;

    gap: 10px;
}


.order-name-area {
    display: flex;
    align-items: center;

    min-width: 0;
}


.line-number {
    width: 34px;
    height: 34px;

    flex-shrink: 0;

    margin-right: 10px;

    display: inline-flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: var(--red);
    color: white;

    font-size: 15px;
    font-weight: 950;
}


.order-name {
    min-width: 0;

    font-size: 20px;
    font-weight: 950;

    line-height: 1.3;

    white-space: normal;

    word-break: keep-all;
}


.quantity {
    margin-left: 7px;

    flex-shrink: 0;

    font-size: 15px;
    font-weight: 850;

    color: var(--muted);
}


.order-price {
    align-self: flex-end;

    font-size: 22px;
    font-weight: 950;

    color: var(--red);
}


/* 옵션 */

.options {
    margin-top: 10px;
    margin-left: 0;

    display: flex;
    flex-wrap: wrap;

    align-content: flex-start;

    gap: 6px;
}


.option {
    min-height: 30px;

    padding: 5px 9px;

    display: inline-flex;

    align-items: center;

    border-radius: 7px;

    background: #fff0bc;
    color: #70510a;

    font-size: 13px;
    font-weight: 850;

    line-height: 1.15;
}


.option.add {
    background: #ffe29a;
}


.option.remove {
    background: #ffe1e1;
    color: #a92626;
}


/* 주문이 하나면 (1,1) 한 칸만 사용.
   나머지 7칸은 빈 공간으로 유지된다. */


/* 주문 없음만 전체 영역 사용 */

.empty {
    grid-column: 1 / -1;
    grid-row: 1 / -1;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;
}


/* 좁은 화면에서는 가독성 보호 */

@media (max-width: 1100px) {

    .order-list {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        grid-template-rows:
            repeat(4, minmax(0, 1fr));

        grid-auto-rows:
            calc((100% - 30px) / 4);
    }
}

</style>

</head>


<body>

<div class="screen">


<header class="header">

    <div class="brand">

        <span class="brand-main">
            ASZ
        </span>

        <span class="brand-sub">
            STAFF
        </span>

    </div>


    <div
        class="status"
        id="staffStatus"
    >
        주문 대기 중
    </div>

</header>



<section class="order-info">


    <div class="order-main-info">


        <div class="number-group">

            <div class="number-label">
                주문번호
            </div>

            <div
                class="order-number"
                id="orderNumber"
            >
                --
            </div>

        </div>



        <div
            class="mobile-number-group"
            id="mobileNumberGroup"
        >

            <div class="number-label">
                맥오더 번호
            </div>

            <div
                class="mobile-number"
                id="mobileOrderNumber"
            >
                --
            </div>

        </div>


    </div>


    <div
        class="order-mode"
        id="orderMode"
    >
        주문 접수 전
    </div>


</section>



<section class="order-panel">


    <div class="order-header">

        <div class="order-title">
            주문 메뉴
        </div>

        <div
            class="order-count"
            id="orderCount"
        >
            총 0개
        </div>

    </div>



    <div
        class="order-list"
        id="orderList"
    ></div>



    <div class="total-area">

        <div class="total-label">
            총 주문금액
        </div>

        <div
            class="total-price"
            id="totalPrice"
        >
            0원
        </div>

    </div>


</section>


</div>

<script src="staff.js"></script>

</body>
</html>
